name: Pronóstico diario 16 días + alertas agroclimáticas

on:
  schedule:
    - cron: "0 10 * * *"     # 10:00 UTC = 06:00 en La Paz (corridas 00z de GFS y ECMWF ya disponibles)
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano
    inputs:
      limite_municipios:
        description: "Solo los N primeros municipios (vacío = todos). Útil para pruebas."
        required: false
        default: ""

permissions:
  contents: write             # para hacer commit del JSON

concurrency:
  group: pronostico-diario
  cancel-in-progress: false

jobs:
  pronostico:
    if: github.repository == 'cbarriosperez/Project_Pests_Diseases_Bolivian_Crops'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout (solo lo necesario)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts/pronostico
            Scripts/Modelos_Agroclimaticos_Python
            data/geo
            data/pronostico
            data/alertas

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Scripts/pronostico/requirements.txt

      - name: Dependencias
        run: pip install -r Scripts/pronostico/requirements.txt

      - name: Descargar pronóstico
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}   # opcional; vacío = API gratuita
          LIMITE: ${{ github.event.inputs.limite_municipios }}
        run: |
          if [ -n "$LIMITE" ]; then
            python Scripts/pronostico/pronostico_municipios.py --limite-municipios "$LIMITE"
          else
            python Scripts/pronostico/pronostico_municipios.py
          fi

      - name: Modelos agroclimáticos (alertas por cultivo)
        run: python Scripts/Modelos_Agroclimaticos_Python/correr_modelos.py

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pronostico/pronostico_latest.json data/alertas/alertas_latest.json
          if git diff --staged --quiet; then
            echo "Sin cambios en el pronóstico ni en las alertas."
            exit 0
          fi
          git commit -m "Pronóstico y alertas $(TZ=America/La_Paz date +%F)"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            echo "Push falló (intento $i), reintentando..."; sleep 15
          done
          exit 1

  # Nivel «Comunidad»: pronóstico por celdas (0,25° sin clave de API; 0,1° con clave) para las
  # comunidades de los municipios productores. Corre después del municipal porque con la API gratuita
  # el límite por hora obliga a repartir las consultas (~1,5-2 h). Las alertas por comunidad las
  # calcula la web en el navegador a partir de este pronóstico (no se guardan en el repositorio).
  comunidades:
    needs: pronostico
    if: always() && github.repository == 'cbarriosperez/Project_Pests_Diseases_Bolivian_Crops'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout (solo lo necesario)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Scripts/pronostico
            data/geo/comunidades
            data/geo/cultivos_municipios.json
            data/pronostico
          sparse-checkout-cone-mode: false

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Scripts/pronostico/requirements.txt

      - name: Dependencias
        run: pip install -r Scripts/pronostico/requirements.txt

      - name: Altitud de las comunidades (solo la primera vez)
        run: |
          if [ ! -f data/geo/comunidades/elevacion_comunidades.json ]; then
            pip install rasterio
            python Scripts/pronostico/elevacion_comunidades.py
          else
            echo "elevacion_comunidades.json ya existe."
          fi

      - name: Descargar pronóstico por comunidades
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}           # opcional; vacío = API gratuita (0,25°)
          RESOLUCION_COMUNIDADES: ${{ vars.RESOLUCION_COMUNIDADES }}       # opcional; vacío = 0,1° con clave / 0,25° sin clave
          LIMITE: ${{ github.event.inputs.limite_municipios }}
        run: |
          if [ -n "$LIMITE" ]; then
            python Scripts/pronostico/pronostico_municipios.py --nivel comunidades --limite-municipios "$LIMITE"
          else
            python Scripts/pronostico/pronostico_municipios.py --nivel comunidades
          fi

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pronostico/pronostico_comunidades_latest.json
          git add data/geo/comunidades/elevacion_comunidades.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Sin cambios en el pronóstico por comunidades."
            exit 0
          fi
          git commit -m "Pronóstico por comunidades $(TZ=America/La_Paz date +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            echo "Push falló (intento $i), reintentando..."; sleep 20
          done
          exit 1
